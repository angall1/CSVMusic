name: Release Builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must already exist)"
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', github.event.inputs.tag) || github.ref }}
  DENO_VERSION: "2.9.4"
  YTDLP_VERSION: "2026.08.19"

jobs:
  ipod-helper:
    name: Build portable iPod helper (${{ matrix.bundle }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: linux-x86_64
            platform: linux
          - os: macos-15
            bundle: darwin-arm64
            platform: darwin
          - os: macos-15-intel
            bundle: darwin-x86_64
            platform: darwin
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Build Linux helper and collect runtime libraries
        if: ${{ matrix.platform == 'linux' }}
        env:
          IPOD_BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgpod-dev
          root="resources/ipod/$IPOD_BUNDLE"
          mkdir -p "$root/bin" "$root/lib" "$root/licenses"
          gcc csvmusic/core/ipod_sync_helper.c -o "$root/bin/ipod-sync" \
            $(pkg-config --cflags --libs libgpod-1.0 glib-2.0)
          chmod +x "$root/bin/ipod-sync"
          ldd "$root/bin/ipod-sync" | awk '$2 == "=>" && $3 ~ /^\// { print $1 "\t" $3 }' | \
          while IFS=$'\t' read -r soname library; do
            case "$soname" in
              libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*) continue ;;
            esac
            cp -L "$library" "$root/lib/$soname"
            package=$(dpkg-query -S "$library" 2>/dev/null | head -n 1 | cut -d: -f1 || true)
            if [ -n "$package" ] && [ -f "/usr/share/doc/$package/copyright" ]; then
              cp "/usr/share/doc/$package/copyright" "$root/licenses/${package}-copyright.txt"
            fi
          done
          cp /usr/share/doc/libgpod-dev/copyright "$root/licenses/libgpod-copyright.txt"
          { LD_LIBRARY_PATH="$PWD/$root/lib" "$root/bin/ipod-sync" 2>&1 || true; } | grep -q "Usage:"

      - name: Build macOS helper and collect runtime libraries
        if: ${{ matrix.platform == 'darwin' }}
        env:
          IPOD_BUNDLE: ${{ matrix.bundle }}
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config intltool gettext glib gdk-pixbuf sqlite libplist libusb dylibbundler cpanminus
          cpanm --notest XML::Parser
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl --fail --location --retry 3 \
            --output "$work/libgpod.tar.bz2" \
            "https://downloads.sourceforge.net/project/gtkpod/libgpod/libgpod-0.8/libgpod-0.8.3.tar.bz2"
          tar -xjf "$work/libgpod.tar.bz2" -C "$work"
          prefix="$work/prefix"
          cd "$work/libgpod-0.8.3"
          ./configure --prefix="$prefix" --disable-dependency-tracking --disable-udev --disable-mono \
            --without-hal --without-libimobiledevice
          make -j"$(sysctl -n hw.logicalcpu)"
          make install
          cd "$GITHUB_WORKSPACE"
          root="resources/ipod/$IPOD_BUNDLE"
          mkdir -p "$root/bin" "$root/lib" "$root/licenses"
          PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" \
            cc csvmusic/core/ipod_sync_helper.c -o "$root/bin/ipod-sync" \
            $(PKG_CONFIG_PATH="$prefix/lib/pkgconfig:${PKG_CONFIG_PATH:-}" pkg-config --cflags --libs libgpod-1.0 glib-2.0)
          chmod +x "$root/bin/ipod-sync"
          dylibbundler -od -b -x "$root/bin/ipod-sync" -d "$root/lib" -p @executable_path/../lib/
          cp "$work/libgpod-0.8.3/COPYING" "$root/licenses/libgpod-COPYING.txt"
          "$root/bin/ipod-sync" 2>&1 | grep -q "Usage:"

      - name: Upload portable iPod helper
        uses: actions/upload-artifact@v4
        with:
          name: csvmusic-ipod-helper-${{ matrix.bundle }}
          path: resources/ipod/${{ matrix.bundle }}
          if-no-files-found: error

  build:
    needs: ipod-helper
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build against an older supported glibc baseline for broader Linux compatibility.
          - os: ubuntu-22.04
            python_version: "3.11"
            suffix: linux
            ffmpeg_platform: linux
            deno_target: x86_64-unknown-linux-gnu
            deno_platform: linux
            deno_binary: deno
            ipod_bundle: linux-x86_64
            build_sdist: true
          - os: macos-15
            python_version: "3.11"
            suffix: macos-arm64
            ffmpeg_platform: darwin
            ffmpeg_arch: arm64
            deno_target: aarch64-apple-darwin
            deno_platform: darwin
            deno_binary: deno
            ipod_bundle: darwin-arm64
            build_sdist: false
          - os: macos-15-intel
            python_version: "3.11"
            suffix: macos-intel
            ffmpeg_platform: darwin
            ffmpeg_arch: amd64
            deno_target: x86_64-apple-darwin
            deno_platform: darwin
            deno_binary: deno
            ipod_bundle: darwin-x86_64
            build_sdist: false
          - os: windows-latest
            python_version: "3.11"
            suffix: windows
            ffmpeg_platform: win
            deno_target: x86_64-pc-windows-msvc
            deno_platform: windows
            deno_binary: deno.exe
            ipod_bundle: linux-x86_64
            build_sdist: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pyinstaller pytest "yt-dlp[default]==${YTDLP_VERSION}" ytmusicapi
          python -m pip install -e .

      - name: Test cross-platform library modules
        run: |
          python -m pytest -q
          python -c "from PySide6.QtWebEngineCore import QWebEnginePage, QWebEngineProfile; from PySide6.QtWebEngineWidgets import QWebEngineView; from csvmusic.ui.library_mode import LibraryModeDialog; print('Library Mode and QtWebEngine imports OK')"

      - name: Ensure license directory
        run: mkdir -p licenses

      - name: Add portable iPod helper to release
        uses: actions/download-artifact@v4
        with:
          name: csvmusic-ipod-helper-${{ matrix.ipod_bundle }}
          path: resources/ipod/${{ matrix.ipod_bundle }}

      - name: Fetch Deno runtime
        env:
          DENO_TARGET: ${{ matrix.deno_target }}
          DENO_PLATFORM: ${{ matrix.deno_platform }}
          DENO_BINARY: ${{ matrix.deno_binary }}
        run: |
          set -euo pipefail
          archive="deno-${DENO_TARGET}.zip"
          base_url="https://github.com/denoland/deno/releases/download/v${DENO_VERSION}"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          curl --fail --location --retry 3 --output "$tmp_dir/$archive" "$base_url/$archive"
          curl --fail --location --retry 3 --output "$tmp_dir/$archive.sha256sum" "$base_url/$archive.sha256sum"
          python - "$tmp_dir/$archive" "$tmp_dir/$archive.sha256sum" <<'PY'
          import hashlib
          import pathlib
          import re
          import sys

          archive_path = pathlib.Path(sys.argv[1])
          checksum_path = pathlib.Path(sys.argv[2])
          checksum_text = checksum_path.read_text(encoding="utf-8")
          match = re.search(r"(?i)\b[0-9a-f]{64}\b", checksum_text)
          if match is None:
              raise SystemExit(f"No SHA256 hash found in {checksum_path.name}")
          expected = match.group(0).lower()
          with archive_path.open("rb") as archive_file:
              actual = hashlib.file_digest(archive_file, "sha256").hexdigest()
          if actual != expected:
              raise SystemExit(
                  f"SHA256 mismatch for {archive_path.name}: expected {expected}, got {actual}"
              )
          print(f"Verified SHA256 for {archive_path.name}: {actual}")
          PY
          mkdir -p "resources/deno/${DENO_PLATFORM}"
          unzip -j "$tmp_dir/$archive" "$DENO_BINARY" -d "resources/deno/${DENO_PLATFORM}"
          chmod +x "resources/deno/${DENO_PLATFORM}/${DENO_BINARY}"
          curl --fail --location --retry 3 --output licenses/DENO-LICENSE.md \
            "https://raw.githubusercontent.com/denoland/deno/v${DENO_VERSION}/LICENSE.md"
          "resources/deno/${DENO_PLATFORM}/${DENO_BINARY}" --version

      - name: Fetch FFmpeg (Linux)
        if: ${{ matrix.ffmpeg_platform == 'linux' }}
        run: |
          set -euo pipefail
          mkdir -p resources/ffmpeg/linux
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          urls=(
            "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          )
          archive="$tmp_dir/ffmpeg.tar.xz"
          downloaded=0
          for url in "${urls[@]}"; do
            echo "Downloading FFmpeg from $url"
            if curl --fail --location --retry 3 --retry-delay 5 --output "$archive" "$url" && tar -tf "$archive" >/dev/null; then
              downloaded=1
              break
            fi
            echo "FFmpeg download was unavailable or not a valid tar archive; trying next source."
            rm -f "$archive"
          done
          if [ "$downloaded" -ne 1 ]; then
            echo "Unable to download a valid Linux FFmpeg archive." >&2
            exit 1
          fi
          tar -xf "$archive" -C "$tmp_dir"
          ffmpeg_bin="$(find "$tmp_dir" -type f -path '*/bin/ffmpeg' -o -type f -name ffmpeg | head -n 1)"
          if [ -z "$ffmpeg_bin" ]; then
            echo "ffmpeg binary not found in downloaded archive." >&2
            find "$tmp_dir" -maxdepth 3 -type f >&2
            exit 1
          fi
          cp "$ffmpeg_bin" resources/ffmpeg/linux/ffmpeg
          chmod +x resources/ffmpeg/linux/ffmpeg

      - name: Fetch FFmpeg (macOS)
        if: ${{ matrix.ffmpeg_platform == 'darwin' }}
        env:
          FFMPEG_ARCH: ${{ matrix.ffmpeg_arch }}
        run: |
          set -euo pipefail
          mkdir -p resources/ffmpeg/darwin
          curl --fail --location --retry 3 \
            --output resources/ffmpeg/darwin/ffmpeg \
            "https://github.com/binmgr/ffmpeg/releases/latest/download/ffmpeg-darwin-${FFMPEG_ARCH}"
          chmod +x resources/ffmpeg/darwin/ffmpeg
          actual_arch="$(file resources/ffmpeg/darwin/ffmpeg)"
          echo "$actual_arch"
          if [ "$FFMPEG_ARCH" = "arm64" ]; then
            echo "$actual_arch" | grep -Eq 'arm64|aarch64'
          else
            echo "$actual_arch" | grep -Eq 'x86_64|x86-64'
          fi
          resources/ffmpeg/darwin/ffmpeg -version | head -n 1

      - name: Fetch FFmpeg (Windows)
        if: ${{ matrix.ffmpeg_platform == 'win' }}
        shell: pwsh
        run: |
          $destDir = "resources/ffmpeg/windows"
          $destExe = Join-Path $destDir "ffmpeg.exe"
          if (Test-Path $destExe) {
            Write-Host "Using existing FFmpeg at $destExe"
            return
          }
          Write-Host "Downloading FFmpeg for Windows…"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null
          $primary = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          $fallback = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $tmpZip = Join-Path $env:TEMP ("ffmpeg_" + [Guid]::NewGuid().ToString() + ".zip")
          $tmpDir = Join-Path $env:TEMP ("ffmpeg_unpack_" + [Guid]::NewGuid().ToString())
          try {
            try {
              Invoke-WebRequest -Uri $primary -OutFile $tmpZip -UseBasicParsing
            } catch {
              Write-Host "Primary FFmpeg download failed, trying fallback…"
              Invoke-WebRequest -Uri $fallback -OutFile $tmpZip -UseBasicParsing
            }
            Expand-Archive -Path $tmpZip -DestinationPath $tmpDir -Force
            $ffmpeg = Get-ChildItem -Path $tmpDir -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
            if (-not $ffmpeg) {
              throw "ffmpeg.exe not found in downloaded archive"
            }
            Copy-Item $ffmpeg.FullName $destExe -Force
          } finally {
            Remove-Item $tmpZip -Force -ErrorAction SilentlyContinue
            Remove-Item $tmpDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Build source and wheel distributions
        if: ${{ matrix.build_sdist == true }}
        run: python -m build

      - name: Confirm PyInstaller spec file
        run: |
          if [ ! -f "CSVMusic.spec" ]; then
            echo "Unable to locate CSVMusic.spec" >&2
            echo "Repository contents:" >&2
            ls -al >&2
            exit 1
          fi

      - name: Build PyInstaller bundle
        run: pyinstaller CSVMusic.spec

      - name: Package PyInstaller bundle
        env:
          PACKAGE_SUFFIX: ${{ matrix.suffix }}
        run: |
          python - <<'PY'
          from __future__ import annotations
          import os
          import pathlib
          import zipfile
          import shutil
          import sys
          import stat
          import subprocess

          suffix = os.environ["PACKAGE_SUFFIX"]
          dist_dir = pathlib.Path("dist")
          app_dir = dist_dir / "CSVMusic"
          mac_app = dist_dir / "CSVMusic.app"
          if sys.platform.startswith("darwin"):
              if not mac_app.exists() or not mac_app.is_dir():
                  raise SystemExit("Missing macOS app bundle: expected dist/CSVMusic.app")
              app_dir = mac_app
          # Handle cases:
          # - One-folder: dist/CSVMusic is a directory (use as-is)
          # - One-file (Linux/mac): dist/CSVMusic is a file (create a staging dir)
          # - One-file (Windows): dist/CSVMusic.exe exists (create dir and copy)
          staging_root: pathlib.Path | None = None
          if not sys.platform.startswith("darwin") and app_dir.exists() and app_dir.is_file():
              # Create a staging folder to wrap the single-file binary
              staging_root = dist_dir / "_pkgroot"
              if staging_root.exists():
                  shutil.rmtree(staging_root)
              (staging_root / "CSVMusic").mkdir(parents=True, exist_ok=True)
              shutil.copy2(app_dir, (staging_root / "CSVMusic" / app_dir.name))
              app_dir = staging_root / "CSVMusic"
          elif not sys.platform.startswith("darwin") and not app_dir.exists():
              single_candidates = [
                  dist_dir / "CSVMusic.exe",
                  dist_dir / "CSVMusic",
              ]
              # macOS app bundle
              if mac_app.exists() and mac_app.is_dir():
                  app_dir = mac_app
              else:
                  for candidate in single_candidates:
                      if candidate.exists():
                          app_dir.mkdir(exist_ok=True)
                          shutil.copy2(candidate, app_dir / candidate.name)
                          break
                  else:
                      raise SystemExit(
                          "Missing PyInstaller output: neither directory nor single-file bundle found"
                      )
          # Ensure yt-dlp CLI is bundled alongside the app binary on platforms
          # that still use it. macOS frozen builds prefer the bundled yt_dlp
          # Python module; adding an executable inside the .app after build can
          # invalidate the bundle signature and trigger Finder's "damaged" UI.
          def _ensure_exec(p: pathlib.Path) -> None:
              try:
                  mode = p.stat().st_mode
                  p.chmod(mode | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
              except Exception:
                  pass

          plat_win = sys.platform.startswith("win")
          plat_mac = sys.platform.startswith("darwin")
          if not plat_mac:
              ytdlp_name = "yt-dlp.exe" if plat_win else "yt-dlp"
              # Determine where the app's executable lives so yt-dlp sits alongside it
              bin_dir = app_dir
              if (app_dir / "CSVMusic").exists() or (app_dir / "CSVMusic.exe").exists():
                  bin_dir = app_dir
              # Fetch the tested standalone yt-dlp version for reproducible releases
              ytdlp_version = os.environ["YTDLP_VERSION"]
              dst_ytdlp = bin_dir / ytdlp_name
              url = (
                  f"https://github.com/yt-dlp/yt-dlp/releases/download/{ytdlp_version}/yt-dlp.exe" if plat_win else
                  f"https://github.com/yt-dlp/yt-dlp/releases/download/{ytdlp_version}/yt-dlp_linux"
              )
              try:
                  import urllib.request
                  with urllib.request.urlopen(url) as r, open(dst_ytdlp, "wb") as f:
                      shutil.copyfileobj(r, f)
              except Exception as e:
                  raise SystemExit(f"Failed to download yt-dlp from {url}: {e}")
              _ensure_exec(dst_ytdlp)
          if sys.platform.startswith("linux"):
              linux_guide = pathlib.Path("README-LINUX.md")
              if linux_guide.exists():
                  shutil.copy2(linux_guide, app_dir / linux_guide.name)
          if plat_mac:
              subprocess.run(["codesign", "--force", "--deep", "--sign", "-", str(app_dir)], check=True)
              subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app_dir)], check=True)
          zip_path = dist_dir / f"CSVMusic-{suffix}.zip"
          if plat_mac:
              subprocess.run(
                  ["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(app_dir), str(zip_path)],
                  check=True,
              )
              raise SystemExit(0)
          with zipfile.ZipFile(zip_path, "w", zipfile.ZIP_DEFLATED) as zf:
              zf.write(app_dir, app_dir.name + "/")
              for path in sorted(app_dir.rglob("*")):
                  if path.is_dir():
                      continue
                  arcname = app_dir.name + "/" + path.relative_to(app_dir).as_posix()
                  zf.write(path, arcname)
          # Cleanup staging if used (zip is already written)
          if staging_root and staging_root.exists():
              shutil.rmtree(staging_root, ignore_errors=True)
          PY

      - name: Collect PyInstaller bundle
        run: |
          mkdir -p release
          cp dist/CSVMusic-${{ matrix.suffix }}.zip release/

      - name: Collect Python distributions
        if: ${{ matrix.build_sdist == true }}
        run: |
          mkdir -p release
          cp dist/*.whl release/
          cp dist/*.tar.gz release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suffix }}
          path: release

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release/*.whl
            release/*.tar.gz
            release/*.zip
