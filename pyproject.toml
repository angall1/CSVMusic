[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csvmusic"
version = "1.7.2"
description = "Convert Spotify playlists to MP3/M4A via YouTube Music (packaged, no extra installs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"PySide6>=6.6",
	"yt-dlp[default]==2026.8.19",
	"ytmusicapi>=1.7.4",
	"mutagen>=1.47.0",
	"requests>=2.32.0",
	"pandas>=2.2.0",
]

[project.scripts]
csvmusic = "csvmusic.app:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true
packages = ["csvmusic", "csvmusic.core", "csvmusic.ui"]

[tool.setuptools.package-data]
csvmusic = [
	"core/*.c",
	"../resources/ffmpeg/darwin/ffmpeg",
	"../resources/ffmpeg/linux/ffmpeg",
	"../resources/ffmpeg/windows/ffmpeg.exe",
	"../resources/deno/darwin/deno",
	"../resources/deno/linux/deno",
	"../resources/deno/windows/deno.exe",
	"../resources/fonts/*",
	"../licenses/*"
]

